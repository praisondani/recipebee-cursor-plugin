name: Publish RecipeBee SDK

on:
  workflow_dispatch:
  push:
    tags:
      - "recipebee-sdk-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish package with provenance
        run: npm publish --access public --provenance
        working-directory: packages/recipebee-sdk
